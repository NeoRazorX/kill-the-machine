# Publishes the game on GitHub Pages on every push to main: only what the browser loads (the landing
# page and the game, their styles and icons, the sources, three.js, the exported models and the promo
# images), plus the licences and the list of latest changes, made from the history. The Blender sources,
# tests and tools stay in the repository.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push replaces one still waiting.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Enough history for the list of latest changes.
          fetch-depth: 50
      - name: Reunir los archivos del juego
        run: |
          mkdir -p _site/assets/models _site/docs/promo
          cp index.html game.html style.css favicon.ico site.webmanifest LICENSE _site/
          cp -r src lib _site/
          cp -r assets/icons _site/assets/
          cp assets/models/*.glb _site/assets/models/
          cp assets/LICENSE _site/assets/
          cp docs/promo/*.jpg _site/docs/promo/
          python3 tools/changes.py 15 > _site/changes.json
          du -sh _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
